[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "dandori-local"
version = "0.2.0"
description = "DANDORI - completely local personal task manager"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PySide6-Essentials==6.10.3",
  "SQLAlchemy==2.0.52",
  "alembic==1.19.1",
  "jpholiday==1.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-qt==4.5.0",
  "ruff==0.16.4",
]

[project.scripts]
dandori = "dandori.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dandori = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]
